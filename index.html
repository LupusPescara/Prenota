<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff"><meta name="referrer" content="no-referrer">
<title>Prenota · Lupus Pescara</title>
<style>:root{font-family:Arial,Helvetica,sans-serif;color:#262626;background:#f5f5f7;font-synthesis:none;line-height:1.5;--accent:#5b3e96}*{box-sizing:border-box}body{margin:0}main{width:min(100%,580px);margin:28px auto 60px;padding:0 16px}.card{background:#fff;border:1px solid #dedee3;border-radius:8px;padding:24px;margin:0 0 14px}.heading{border-top:5px solid var(--accent)}.brand{font-size:13px;color:#68636f;margin:0 0 8px}h1{font-size:26px;line-height:1.2;font-weight:500;margin:0 0 16px}h2{font-size:22px;font-weight:500;margin:0 0 12px}p{margin:6px 0}#date{font-weight:600}#place{font-size:15px}#terms{font-size:14px;margin-top:12px}.muted,small{color:#66616e;font-weight:400}label{display:block;font-size:15px;margin:24px 0 9px}.fields>label:first-child{margin-top:0}label small{font-size:13px;margin-left:4px}input,select,textarea{width:100%;font:inherit;font-size:16px;color:#262626;background:#fff;border:1px solid #bdbbc4;border-radius:5px;padding:11px 12px;min-height:46px}input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#count{width:112px}input[type=checkbox]{width:19px;min-height:19px;height:19px;margin:2px 0 0;accent-color:var(--accent);flex:0 0 19px}.check{display:flex;align-items:flex-start;gap:10px;font-size:13px}.conditions{font-size:13px}.conditions .check{margin-bottom:12px}details{margin-top:12px}summary{cursor:pointer;color:#514067;text-decoration:underline;text-underline-offset:3px}#privacy{white-space:pre-wrap;margin-top:12px}.error{color:#a32323;font-size:14px;white-space:pre-line}.error:empty{display:none}#formError{margin:12px 0}button,.button{border:0;border-radius:5px;background:var(--accent);color:#fff;padding:12px 28px;font:600 16px Arial,sans-serif;min-height:46px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.secondary{background:#eeeaf5;color:var(--accent)}.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}[hidden],.hide{display:none!important}#success{scroll-margin-top:20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.q{border-top:1px solid #ddd;margin-top:24px}.small{font-size:13px}.status{padding:12px;background:#eeeaf5}.button{display:block;text-decoration:none;text-align:center;margin-top:12px}textarea{min-height:90px}#editor button{margin:8px 0}.footer{display:none}@media(max-width:440px){main{margin-top:16px;padding:0 12px}.card{padding:20px}h1{font-size:24px}#submit{width:100%}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<header class="card heading"><p class="brand">Lupus Pescara</p><h1>Prenota la serata</h1>
<div id="details" hidden><p id="date"></p><p id="place"></p><p id="terms" class="muted"></p></div>
<p id="loading" role="status">Caricamento…</p>
<div id="loadError" hidden><p id="loadMessage" class="error" role="alert"></p><button id="retry" type="button" class="secondary">Riprova</button></div>
</header>
<p id="closed" class="card" hidden>Le prenotazioni per questa serata sono chiuse.</p>
<form id="booking" hidden>
<div class="card fields">
<label for="name">Nome e cognome <span aria-hidden="true">*</span></label>
<input id="name" name="name" autocomplete="name" maxlength="120" minlength="2" required>
<label for="count">Numero di partecipanti <span aria-hidden="true">*</span></label>
<input id="count" name="count" type="number" inputmode="numeric" min="1" value="1" required>
<label for="contact">Telefono o email <small>facoltativo</small></label>
<input id="contact" name="contact" maxlength="180">
<div id="questions"></div>
<div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" tabindex="-1" autocomplete="off"></div>
</div>
<div class="card conditions">
<p id="membership"></p>
<details><summary>Informazioni sui dati personali</summary><p id="privacy"></p></details>
<label class="check"><input id="ack" type="checkbox" required><span>Ho letto le condizioni della serata e le informazioni sui dati personali. *</span></label>
<p id="total" class="muted"></p>
</div>
<p id="formError" class="error" role="alert"></p>
<button id="submit" type="submit">Prenota</button>
</form>
<section id="success" class="card" hidden tabindex="-1" aria-live="polite"><h2>Prenotazione confermata</h2><p id="confirmation"></p><p id="receipt" class="muted"></p></section>
</main>
<script>'use strict';
const API='https://script.google.com/macros/s/AKfycbxXl_yMIALW6hVrvugzsaYG1LTC7WgGgjBEm3bXijsWTHttgetST0S-fR7k4U7kbiIqew/exec';
const $=id=>document.getElementById(id);
const eur=n=>Number(n).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const el=(tag,text)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;};
let config,nonce,busy=false,requestId=crypto.randomUUID();
async function rpc(name,data){
  if(window.google?.script?.run)return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...(data===undefined?[]:[data])));
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),45000);
  let result;
  try{
    // Never send visitor Google cookies, including when following Google's redirects.
    const options={credentials:'omit',redirect:'follow',cache:'no-store',referrerPolicy:'no-referrer',signal:controller.signal};
    const url=name==='publicState'?API+'?api=state&v='+Date.now():API;
    if(name!=='publicState')Object.assign(options,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action:'register',data})});
    const response=await fetch(url,options);
    if(!response.ok)throw new Error('HTTP '+response.status);
    result=await response.json();
    if(typeof result.ok!=='boolean')throw new Error('Invalid response');
  }catch(e){throw new Error(name==='publicState'?'Non riesco a caricare il modulo. Controlla la connessione e riprova.':'Non ho ricevuto la conferma. Premi «Riprova»: la stessa richiesta non crea una seconda prenotazione.');}
  finally{clearTimeout(timer);}
  if(!result.ok)throw new Error(result.error||'Impossibile completare la richiesta.');
  return result.data;
}
function refreshTotal(){if(config)$('total').textContent='Totale serata: '+eur(config.currentPrice*Number($('count').value||1))+' · pagamento sul posto. Tessera esclusa.';}
async function init(){
  $('loading').hidden=false;$('loadError').hidden=true;$('retry').disabled=true;
  try{
    const state=await rpc('publicState');config=state.config;nonce=state.nonce;
    $('date').textContent=new Date(config.date+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'})+' · '+config.time;
    $('place').textContent=config.venue+' · '+config.address;
    const deadline=new Date(config.deadline.slice(0,10)+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'long'});
    $('terms').textContent='Serata '+eur(config.price)+(config.currentPrice<config.price?' · '+eur(config.earlyPrice)+' prenotando entro le '+config.deadline.slice(11)+' del '+deadline:'')+'.';
    $('count').max=config.maxGroup;$('membership').textContent=config.membership;$('membership').hidden=!config.membership;$('privacy').textContent=config.privacy;
    $('questions').replaceChildren();
    config.questions.forEach(q=>{
      const wrap=el('div'),label=el('label',q.label+(q.required?' *':''));label.htmlFor='q_'+q.id;
      let field;if(q.type==='select'){field=el('select');field.append(new Option('Seleziona…',''));q.options.forEach(o=>field.append(new Option(o,o)));}
      else{field=el('input');field.type=q.type==='checkbox'?'checkbox':'text';field.maxLength=1000;}
      field.id='q_'+q.id;field.required=q.required;
      if(q.type==='checkbox'){label.className='check';label.prepend(field);wrap.append(label);}else wrap.append(label,field);
      $('questions').append(wrap);
    });
    $('details').hidden=false;$('booking').hidden=!config.accepting;$('closed').hidden=config.accepting;refreshTotal();
  }catch(e){$('loadMessage').textContent=e.message;$('loadError').hidden=false;}
  finally{$('loading').hidden=true;$('retry').disabled=false;}
}
$('retry').onclick=init;$('count').addEventListener('input',refreshTotal);
$('booking').addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;busy=true;$('formError').textContent='';$('submit').disabled=true;$('submit').textContent='Salvataggio…';
  const answers={};config.questions.forEach(q=>{const f=$('q_'+q.id);answers[q.id]=q.type==='checkbox'?f.checked:f.value;});
  try{
    const r=await rpc('registerBooking',{eventId:config.id,revision:config.revision,nonce,requestId,name:$('name').value,count:Number($('count').value),contact:$('contact').value,answers,website:$('website').value,acknowledged:$('ack').checked,expectedPrice:config.currentPrice});
    if(!r.receipt||!Number.isInteger(r.count))throw new Error('Conferma non valida. Riprova.');
    $('booking').hidden=true;$('success').hidden=false;
    $('confirmation').textContent=r.count+(r.count===1?' partecipante':' partecipanti')+' · '+eur(r.total)+' da pagare sul posto. Tessera esclusa.';
    $('receipt').textContent='Codice: '+r.receipt;$('success').focus();$('success').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(err){$('formError').textContent=err.message;$('submit').textContent='Riprova';}
  finally{busy=false;$('submit').disabled=false;}
});
init();
</script>
</body></html>
